name: Bug 报告
description: 报告崩溃、界面错误、连接或挂载失败等可复现的问题
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜一下已有 issue。**不要在正文、截图或日志里贴 RC 密码、OAuth token、
        `rclone.conf` 内容或完整个人路径**——需要这些信息时维护者会单独告诉你脱敏方式。
  - type: input
    id: gui-version
    attributes:
      label: RCGUI 版本
      description: 设置 → 关于里的版本号，或 `rclone-gui.exe --version`（0.3.0 起支持）。开发版请注明「dev / 树内构建」。
      placeholder: 0.2.1 / 0.3.0-dev
    validations:
      required: true
  - type: dropdown
    id: core-mode
    attributes:
      label: 内核模式
      description: RCGUI 是自己拉起 rclone，还是连你手动启动的端点？
      options:
        - 受管内核（managed core，RCGUI 自己启动 rclone.exe）
        - 外部端点（external endpoint，我自己启动的 rclone rcd）
        - 不确定 / 没连上
    validations:
      required: true
  - type: input
    id: rclone-version
    attributes:
      label: rclone 版本
      description: 受管内核请写随包版本；外部端点请写 `rclone version` 第一行。
      placeholder: v1.76.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统
      placeholder: Windows 11 24H2 x64 / Windows 10 22H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动开始，一步一步写。能稳定复现最好，偶发的写频率。
      placeholder: |
        1. 启动 RCGUI
        2. 远程页 → 选 remote "xxx" → 挂载到 Z:
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错原文就贴原文；有截图就贴截图（记得遮掉用户名和路径）。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        可用的日志：`%APPDATA%\RCGUI\logs\`（插件日志、诊断输出）。
        **贴之前删掉：RC 密码、token、cookie、用户名、真实域名。**
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 issue，没有重复
          required: true
        - label: 正文和附件里没有凭据或完整个人路径
          required: true
