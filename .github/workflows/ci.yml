name: ci

# 会话 18 的「本地 ↔ GitHub Actions」通信实验：
# 云端 runner 只做「构建 + 单元测试 + 产物上传」，本机用 gh 拉日志/产物回来看。
# 图形界面（Slint 弹窗、拖拽、真实 rclone 交互）无法在无头 runner 上验证，仍在本机做。
on:
  push:
    branches:
      - 'session-*'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 插件不在本仓库：按 plugins/manifest.json 从各插件仓库的 Release 下载 zip，
      # 校验 sha256 后解到 crates/app/assets/plugins/。这一步失败通常意味着
      # 插件仓库的 Release 被删了，或 manifest 里的 tag/sha256 过期。
      - name: Fetch plugin assets
        shell: pwsh
        run: ./scripts/fetch_plugins.ps1

      - name: Unit tests
        shell: pwsh
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath test-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release build (app)
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Release -SkipPlugins 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rclone-gui-windows-release
          path: |
            target/release/rclone-gui.exe
            target/release/assets/plugins/**
            test-log.txt
            build-log.txt
          if-no-files-found: warn
