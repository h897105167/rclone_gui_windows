# 持续集成：格式、编译检查、单元测试，外加一次“打包流程冒烟”。
#
# 这里不判断界面好不好用。Slint 窗口、拖拽、和真实 rclone 的交互在云上跑不了，
# 那部分由人工在本机验收（见 CONTRIBUTING.md 的审查门槛）。
# 真正出发布件的流程在 release.yml，只有打 tag 或人工触发才会跑。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 默认只读：CI 只需要读代码，写权限只给 release.yml。
permissions:
  contents: read

# 同一分支连推多次时，取消上一次还没跑完的检查。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: 格式
    runs-on: ubuntu-latest
    # 只跑 cargo fmt，正常十几秒；给 10 分钟是防止排队后偶发的工具链下载卡住。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: 编译与测试
    runs-on: windows-latest
    # 冷缓存下 check + test 大约 10 分钟；45 分钟是给依赖全量重编留的余量。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 插件宿主按 wasm32-wasip1 编译插件，测试里会用到这个 target。
          targets: wasm32-wasip1

      # 依赖没变就直接命中缓存，测试从几分钟降到几十秒。
      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 插件不在本仓库里：按 plugins/manifest.json 拉各自 Release 的 zip 并校验 sha256。
      # 这一步失败，通常是 Release 被删了，或者 manifest 里的 tag/sha256 过期了。
      - name: 取插件
        run: ./scripts/fetch_plugins.ps1

      # 内核清单的结构检查：不联网、不下载，只核对每个来源的字段是否齐全、
      # 哈希是不是 64 位十六进制、URL 是否落在自己声明的前缀里。
      # 放在这里是为了让"清单写坏了"在几分钟内就红，而不是等到打包阶段才发现。
      - name: 检查内核清单
        run: ./scripts/fetch_core.ps1 -CheckManifest

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  cross-repo:
    name: 跨仓库集成（真插件 wasm）
    runs-on: ubuntu-latest
    # 插件 wasm 增量编译几十秒，冷启动要装 wasm32-wasip1 并编 wasmtime 依赖，给足余量。
    timeout-minutes: 30
    env:
      # 写绝对路径：cargo 跑测试时把工作目录设成包目录（crates/plugin-it），
      # 相对路径会指到别处，而「文件不存在」和「没设变量」看起来一模一样。
      RCGUI_IT_WASM: ${{ github.workspace }}/_kvault/target/wasm32-wasip1/release/main.wasm
      RCGUI_IT_CONFIG: ${{ github.workspace }}/_kvault/config.json
      # 本机没设这个变量时测试会各自打印一句「跳过」然后通过；CI 里必须失败。
      RCGUI_IT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cross-
            ${{ runner.os }}-cargo-

      # 插件在自己的仓库里，Release 目前也还没有资产可下载，所以按提交取源码现编：
      # 行里的 ref 是钉死的完整提交，不是分支——分支会漂，同一个 workflow 昨天跑的和
      # 今天跑的就不是同一份插件代码了。
      # 这个提交来自 fix/browse-root-split（插件仓库），把「空路径」的含义拆成两半：
      # 浏览与删除拿到的空路径就是远程真正的根，上传仍落到设置里的上传目录——
      # 本仓库的 kvault_bridge 用这条提交跑跨仓库用例，两者必须成对更新。
      # 插件版本仍是 0.3.1、门槛 min_gui_version = 0.3.2；本程序这一版是 0.3.4，
      # 门槛比它低，跨仓库那一组才跑得起来。
      # 插件那边自己的 CI 在同一份代码上跑 fmt / wasm 目标 / 单测，两条线互补。
      # 插件升级时同步改这三行：ref、以及下面「确认测试会真跑」里期望的 wasm 体积下限。
      # 合并进 main 之后改成 ref: main 的提交哈希（仍然钉提交，不要写分支名）。
      #
      # 落到 _kvault（工作区目录里）就必须让根 Cargo.toml 把它 exclude 掉，
      # 否则插件的 Cargo.toml 会以为自己属于本工作区，报
      # "current package believes it's in a workspace when it's not"。
      # 下一步先验这件事，免得读者只看到一句 cargo 的报错。
      - name: 取插件源码
        uses: actions/checkout@v4
        with:
          repository: h897105167/rcgui-plugin-kvault
          # Split the empty-path meaning between browsing and uploading
          ref: a88d0408f897698c63ff96894ec98938f13db795
          path: _kvault

      - name: 确认插件不在主工作区里
        run: |
          set -eu
          # 在插件目录里读它自己的清单：若它被主工作区收进去却不是成员，cargo 会在
          # 这一步就报 "believes it's in a workspace when it's not"，先拦一道，
          # 免得后面几十行编译日志里只剩一句 cargo 的报错。
          # --no-deps 只读清单，不解析依赖、不碰网络，几秒钟。
          if ! out=$(cargo metadata --no-deps --format-version 1 --manifest-path _kvault/Cargo.toml 2>&1); then
            echo "插件清单读不出来（多半是根 Cargo.toml 少了 workspace.exclude = [\"_kvault\"]）："
            printf '%s\n' "$out" | head -20
            exit 1
          fi
          echo "插件是独立包，不受主工作区影响"

      - name: 编插件 wasm
        run: cargo build --locked --release --target wasm32-wasip1 --manifest-path _kvault/Cargo.toml

      # 测试自己也拦（RCGUI_IT_REQUIRED=1 时缺输入直接 panic），这一步再挡一次：
      # 万一变量被前面某步覆盖成空的，panic 里的那句「没设变量」会让人以为是有意跳过。
      - name: 确认测试会真跑
        run: |
          set -eu
          for v in RCGUI_IT_WASM RCGUI_IT_CONFIG RCGUI_IT_REQUIRED; do
            eval "val=\${$v}"
            [ -n "$val" ] || { echo "$v 是空的，测试会以为自己该跳过"; exit 1; }
          done
          case "$RCGUI_IT_WASM" in
            /*) ;;
            *) echo "RCGUI_IT_WASM 不是绝对路径：$RCGUI_IT_WASM"; exit 1;;
          esac
          test -s "$RCGUI_IT_WASM" || { echo "wasm 没编出来：$RCGUI_IT_WASM"; exit 1; }
          test -f "$RCGUI_IT_CONFIG" || { echo "config.json 不在这里：$RCGUI_IT_CONFIG"; exit 1; }
          size=$(wc -c < "$RCGUI_IT_WASM")
          [ "$size" -ge 200000 ] || { echo "wasm 只有 $size 字节，不像插件真包"; exit 1; }
          ls -l "$RCGUI_IT_WASM" "$RCGUI_IT_CONFIG"

      # 只编这一个测试 crate：宿主其余部分与这条链路无关，没必要跟着重编一遍。
      - name: cargo test -p plugin_it
        run: cargo test -p plugin_it -- --nocapture

  package-smoke:
    name: 打包流程冒烟
    needs: test
    runs-on: windows-latest
    # 复用 test 已经构建好的 target，正常情况下几分钟内结束。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 取插件（哈希不符即失败）
        run: ./scripts/fetch_plugins.ps1

      # 这里必须真的取内核：打包脚本要求 core\rclone.exe 与它的许可证同时在包里，
      # 缺了就中止。CI 跑一遍才能证明"按清单下载 + 校验"这条路是通的。
      - name: 构建 release（含内核）
        run: ./scripts/build.ps1 -Release

      # 只验证"整理目录 → 查绝对路径与凭据 → 打 zip → 写 SHA256SUMS"这条链能跑通。
      # 安装包需要 Inno Setup，留给 release.yml：那里才有真正的发布上下文。
      - name: 打包（不含安装包）
        run: ./scripts/build-release.ps1 -SkipBuild -SkipInstaller

      - name: 展示产物
        run: |
          Get-Content dist\SHA256SUMS
          Get-ChildItem dist | Select-Object Name, Length
          Get-ChildItem dist\RCGUI-*-windows-x64-portable\assets\plugins | Select-Object Name
          # 打的是哪个内核来源，直接看这份记录：默认来源（增强版）时 source_key 是 extra。
          Get-Content dist\RCGUI-*-windows-x64-portable\core\.fetched.json

      - uses: actions/upload-artifact@v4
        with:
          name: package-smoke
          # 注意：这个 zip 里没有安装包，不能当发布件用；内核与插件是完整校验过的。
          path: |
            dist/RCGUI-*-windows-x64-portable.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
