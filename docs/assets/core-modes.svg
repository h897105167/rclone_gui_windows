<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="mt md">
  <title id="mt">RCGUI 的两种 rclone 连接模式</title>
  <desc id="md">左：managed core，RCGUI 拉起的子进程，生命周期归 RCGUI。右：external endpoint，用户在外部启动，RCGUI 只连接、断开时不结束进程。</desc>
  <defs>
    <style>
      .frame{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .app{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.5}
      .proc{fill:#ecfdf5;stroke:#047857;stroke-width:1.5}
      .ext{fill:#fff7ed;stroke:#c2410c;stroke-width:1.5}
      .lbl{font:600 13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#111827}
      .sm{font:400 12px "Segoe UI","Microsoft YaHei",sans-serif;fill:#4b5563}
      .h{font:600 15px "Segoe UI","Microsoft YaHei",sans-serif;fill:#111827}
      .ln{stroke:#334155;stroke-width:1.5;fill:none}
      .dash{stroke:#c2410c;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
      .xd{stroke:#b91c1c;stroke-width:2;fill:none}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="840" height="360" fill="#f8fafc"/>

  <!-- left: managed -->
  <text class="h" x="28" y="40">managed core（默认）</text>
  <rect class="frame" x="28" y="56" width="372" height="248" rx="10" stroke-dasharray="4 4"/>
  <rect class="app" x="52" y="84" width="324" height="196" rx="10"/>
  <text class="lbl" x="68" y="110">RCGUI 进程</text>
  <text class="sm" x="68" y="130">Slint 界面 + Core Manager</text>
  <text class="sm" x="68" y="150">选空闲端口 · 生成凭据 · 握手</text>
  <rect class="proc" x="76" y="170" width="276" height="88" rx="8"/>
  <text class="lbl" x="92" y="194">rclone.exe（子进程）</text>
  <text class="sm" x="92" y="214">RC 只绑 127.0.0.1</text>
  <text class="sm" x="92" y="234">随 RCGUI 退出一起结束</text>
  <line class="ln" x1="214" y1="170" x2="214" y2="152" marker-end="url(#ar)"/>
  <text class="sm" x="28" y="324">结束方式：只结束自己拉起的 PID。可关自动重启。</text>

  <!-- right: external -->
  <text class="h" x="436" y="40">external endpoint（可选）</text>
  <rect class="frame" x="436" y="56" width="372" height="248" rx="10" stroke-dasharray="4 4"/>
  <rect class="app" x="460" y="84" width="324" height="96" rx="10"/>
  <text class="lbl" x="476" y="110">RCGUI 进程</text>
  <text class="sm" x="476" y="130">只持有连接，不持有进程句柄</text>
  <text class="sm" x="476" y="150">断开 = 停止轮询，不结束任何进程</text>
  <rect class="ext" x="460" y="212" width="324" height="68" rx="8"/>
  <text class="lbl" x="476" y="236">rclone rcd（你启动的）</text>
  <text class="sm" x="476" y="256">地址/账号由你填写，默认建议回环地址</text>
  <line class="dash" x1="560" y1="212" x2="560" y2="182" marker-end="url(#ard)"/>
  <text class="sm" x="436" y="324">结束方式：只能断开。禁止 core/quit，禁止 kill。</text>
  <text class="sm" x="436" y="346">挂载/服务仍可经 RC API 启停——那是运行时操作，不是进程生死。</text>
</svg>
