[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/profile",
    "crates/rc",
    "crates/rclone",
    "crates/plugin",
]
# 插件不在这里：每个插件是独立仓库，以 WASM 包的形式从 Release 拉取，
# 见 plugins/manifest.json 与 docs/PLUGIN.md。本工作区只编译本体。

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# multipart: K-Vault 上传走 multipart/form-data（POST /api/v1/upload）
reqwest = { version = "0.12", features = ["json", "multipart"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
semver = "1"
rand = "0.8"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
