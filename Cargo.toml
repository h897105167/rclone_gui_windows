[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/profile",
    "crates/rc",
    "crates/rclone",
    "crates/plugin",
    "plugins/imagehost",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
semver = "1"
rand = "0.8"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
